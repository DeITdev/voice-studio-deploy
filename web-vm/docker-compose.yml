# ============================================================
# VoiceStudio Web UI VM (No GPU Required)
# Copy this `web-vm` folder to your non-GPU VM and run:
#   cp .env.example .env   # edit DGX_BACKEND_URL with your DGX Spark IP
#   docker compose up -d --build
# ============================================================

services:
  voicestudio-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voicestudio-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-17600}:80"
    environment:
      # URL of the VoiceStudio backend running on your NVIDIA DGX Spark GPU VM (port 3900)
      - DGX_BACKEND_URL=${DGX_BACKEND_URL:-http://10.0.0.2:3900}
      # Keep as `/api` to route browser HTTP + WebSocket calls through this container's
      # same-origin Nginx proxy (supports HttpOnly session cookies & avoids CORS issues).
      - FRONTEND_API_BASE=${FRONTEND_API_BASE:-/api}
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
